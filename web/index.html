<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ZCode Token 用量统计</title>
<link rel="stylesheet" href="/style.css" />
<script src="/vendor/echarts.min.js"></script>
</head>
<body>
<div class="page">
  <div class="topnav">
    <div class="brand">ZCode 用量</div>
    <nav class="tabs">
      <button class="tab active" data-page="stats">使用统计</button>
      <button class="tab" data-page="settings">模型设置</button>
    </nav>
  </div>

  <div id="global-error" hidden></div>

  <section id="page-stats">
    <div class="page-head"><h1>使用统计</h1><span class="chip">应用用量</span></div>

    <div class="card stat-cards" id="stat-cards"></div>

    <div class="card">
      <div class="card-head">
        <h2>Token 活动</h2>
        <div class="pill-group" id="heat-mode">
          <button data-mode="daily" class="active">每日</button>
          <button data-mode="weekly">每周</button>
          <button data-mode="cumulative">累计</button>
        </div>
      </div>
      <div id="heat-chart" class="chart chart-heat"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>每日 Token 趋势图</h2>
        <div class="row-right">
          <span class="muted-label">时间范围</span>
          <div class="pill-group" id="trend-range">
            <button data-days="7" class="active">近 7 日</button>
            <button data-days="30">近 30 日</button>
          </div>
          <button id="export-btn" class="btn-ghost">导出 CSV</button>
        </div>
      </div>
      <div id="trend-chart" class="chart chart-trend"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>模型用量</h2></div>
      <div class="donut-wrap">
        <div class="donut-left">
          <div id="donut-chart" class="chart chart-donut"></div>
          <div class="donut-center" id="donut-center"></div>
        </div>
        <div class="donut-list" id="donut-list"></div>
      </div>
    </div>

    <div class="foot" id="stats-foot"></div>
  </section>

  <section id="page-settings" hidden>
    <div class="page-head"><h1>模型设置</h1></div>
    <p class="sub">管理模型供应商额度与价格，用量数据来自 ZCode 本地数据库（只读）。</p>
    <div class="card settings-card">
      <aside id="provider-list"></aside>
      <div class="v-divider"></div>
      <main id="provider-detail"></main>
    </div>
    <div class="foot" id="settings-foot"></div>
  </section>

  <div id="toast" hidden></div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
